<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');
        body { font-family: 'Roboto', sans-serif; -webkit-font-smoothing: antialiased; margin: 0; }

        /* Barre de recherche */
        .search-bar {
            width: 100%;
            max-width: 584px;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 46px 0 48px;
            font-size: 16px;
            color: #202124;
            outline: none;
            background: white;
            transition: box-shadow 0.2s, border-color 0.2s;
            box-sizing: border-box;
        }
        .search-bar:hover, .search-bar:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 584px;
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .search-actions {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Raccourci */
        .shortcut-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #e8eaed;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .shortcut-btn:hover { background: #dadce0; }

        /* Bouton Personnaliser Chrome */
        .customize-btn {
            position: fixed;
            bottom: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e3edfd;
            border: none;
            border-radius: 100px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 500;
            color: #0b57d0;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        .customize-btn:hover { 
            background: #d3e3fd; 
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }

        /* Menu apps (Grille 3x3) */
        .apps-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .apps-btn:hover { background: rgba(60,64,67,.08); }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between">

    <header class="flex items-center justify-end gap-3 px-6 py-4 w-full">
        <a href="https://mail.google.com" class="text-[14px] text-[#202124] hover:underline no-underline font-normal">Gmail</a>
        <a href="https://images.google.fr" class="text-[14px] text-[#202124] hover:underline no-underline font-normal mr-1">Images</a>

    </header>

    <main class="flex-1 flex flex-col items-center justify-center -mt-16">

        <div class="mb-7 select-none">
            <img src="google-logo-2.png" alt="Google" style="height: 92px; width: auto; object-fit: contain;">
        </div>

        <div class="search-wrapper mb-7">
            <span class="search-icon">
                <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </span>
            <input type="text" class="search-bar" placeholder="Rechercher sur Google ou saisir une URL" />
            <div class="search-actions">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" style="cursor:pointer;">
                    <path fill="#4285f4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path fill="#34a853" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <svg viewBox="0 0 192 192" width="22" height="22" style="cursor:pointer;" xmlns="http://www.w3.org/2000/svg">
                    <rect fill="none" height="192" width="192"/>
                    <g>
                        <circle cx="96" cy="96" fill="#4285f4" r="20"/>
                        <path d="M96 32c-35.35 0-64 28.65-64 64s28.65 64 64 64 64-28.65 64-64-28.65-64-64-64zm0 112c-26.47 0-48-21.53-48-48s21.53-48 48-48 48 21.53 48 48-21.53 48-48 48z" fill="#34a853"/>
                        <path d="M96 56c-22.09 0-40 17.91-40 40h16c0-13.23 10.77-24 24-24V56z" fill="#ea4335"/>
                        <path d="M96 136v16c22.09 0 40-17.91 40-40h-16c0 13.23-10.77 24-24 24z" fill="#fbbc05"/>
                    </g>
                </svg>
            </div>
        </div>

        <div class="flex flex-col items-center gap-3">
            <button class="shortcut-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1f1f1f">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
            <span class="text-[12px] text-[#1f1f1f]">Ajouter un racc...</span>
        </div>
    </main>

    <footer class="h-16">
        <button class="customize-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#0b57d0">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            Personnaliser Chrome
        </button>
    </footer>

</body>
</html>
